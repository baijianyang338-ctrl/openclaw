<!DOCTYPE html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no'><title>AI Interactive Installation</title><style>html,body{margin:0;overflow:hidden;background:#02040a;font-family:-apple-system,BlinkMacSystemFont,sans-serif}canvas,video{position:fixed;inset:0;width:100%;height:100%}video{object-fit:cover;opacity:.04;transform:scaleX(-1)}#ui{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:10;padding:16px 24px;border-radius:24px;background:rgba(0,0,0,.28);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.08);color:#fff;text-align:center}#title{font-size:18px;font-weight:600}#mode{margin-top:6px;font-size:13px;color:#70f7ff}body:before{content:'';position:fixed;inset:0;background:radial-gradient(circle at center,rgba(0,255,255,.07),transparent 60%);pointer-events:none}</style></head><body><video id='video' autoplay playsinline muted></video><canvas id='c'></canvas><div id='ui'><div id='title'>AI Interactive Installation</div><div id='mode'>Object Contour</div></div><script type='module'>import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';import {HandLandmarker,PoseLandmarker,FilesetResolver} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';const mobile=/iPhone|iPad|Android/.test(navigator.userAgent);const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:false,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,1000);camera.position.z=110;scene.add(new THREE.AmbientLight(0xffffff,1.2));const COUNT=mobile?8500:14000;const geo=new THREE.BufferGeometry();const pos=new Float32Array(COUNT*3);const vel=new Float32Array(COUNT*3);const base=new Float32Array(COUNT*3);for(let i=0;i<COUNT;i++){const a=Math.random()*Math.PI*2;const r=Math.random()*50;const x=Math.cos(a)*r;const y=Math.sin(a)*r;const z=(Math.random()-.5)*70;pos[i*3]=x;pos[i*3+1]=y;pos[i*3+2]=z;base[i*3]=x;base[i*3+1]=y;base[i*3+2]=z}geo.setAttribute('position',new THREE.BufferAttribute(pos,3));const points=new THREE.Points(geo,new THREE.PointsMaterial({size:1,color:0x74f2ff,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(points);const video=document.getElementById('video');const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:480},height:{ideal:360},frameRate:{ideal:24,max:30}},audio:false});video.srcObject=stream;await video.play();const off=document.createElement('canvas');off.width=80;off.height=60;const octx=off.getContext('2d',{willReadFrequently:true});const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');const hand=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'},runningMode:'VIDEO',numHands:2});const pose=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task'},runningMode:'VIDEO',numPoses:1});let contour=[];let hands=[];let body=[];let mode=0;const modes=['Object Contour','Digital Human','Apple Keynote','Fluid Space'];addEventListener('click',()=>{mode=(mode+1)%4;document.getElementById('mode').innerText=modes[mode]});setInterval(()=>{octx.save();octx.scale(-1,1);octx.drawImage(video,-80,0,80,60);octx.restore();const img=octx.getImageData(0,0,80,60).data;contour=[];for(let y=1;y<59;y+=2){for(let x=1;x<79;x+=2){const i=(y*80+x)*4;const a=(img[i]+img[i+1]+img[i+2])/3;const b=(img[i+4]+img[i+5]+img[i+6])/3;if(Math.abs(a-b)>20){contour.push((x-40)*2.6,(30-y)*3.2,(Math.random()-.5)*10)}}}hands=hand.detectForVideo(video,performance.now()).landmarks||[];body=pose.detectForVideo(video,performance.now()).landmarks?.[0]||[]},100);let t=0;function animate(){requestAnimationFrame(animate);t+=0.01;const p=geo.attributes.position.array;for(let i=0;i<COUNT;i++){const idx=i*3;let tx=base[idx],ty=base[idx+1],tz=base[idx+2];if(mode===0&&contour.length>3){const ci=(i%(contour.length/3))*3;tx=contour[ci];ty=contour[ci+1];tz=contour[ci+2]}else if(mode===1&&body.length){const b=body[i%33];tx=(b.x-.5)*120;ty=(.5-b.y)*220;tz=(b.z||0)*60}else if(mode===2){const ang=i*.003+t;tx=Math.cos(ang)*55;ty=Math.sin(ang*1.4)*40;tz=Math.sin(ang)*40}else if(mode===3){tx+=Math.sin(t*2+i*.02)*15;ty+=Math.cos(t*2+i*.02)*15;tz+=Math.sin(t+i*.01)*20}for(const h of hands){for(const hp of h){const hx=(0.5-hp.x)*160;const hy=(0.5-hp.y)*280;const dx=p[idx]-hx;const dy=p[idx+1]-hy;const d=Math.sqrt(dx*dx+dy*dy);if(d<30){vel[idx]+=dx*.012;vel[idx+1]+=dy*.012}}}vel[idx]+=(tx-p[idx])*.007;vel[idx+1]+=(ty-p[idx+1])*.007;vel[idx+2]+=(tz-p[idx+2])*.007;vel[idx]*=.88;vel[idx+1]*=.88;vel[idx+2]*=.88;p[idx]+=vel[idx];p[idx+1]+=vel[idx+1];p[idx+2]+=vel[idx+2]}geo.attributes.position.needsUpdate=true;points.rotation.y=Math.sin(t*.3)*.08;renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>

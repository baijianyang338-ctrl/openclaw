<!DOCTYPE html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no'><title>Cyber AI Particle Stage</title><style>html,body{margin:0;overflow:hidden;background:#03040a;font-family:-apple-system,BlinkMacSystemFont,sans-serif}canvas,video{position:fixed;inset:0;width:100%;height:100%}video{object-fit:cover;opacity:.08;transform:scaleX(-1)}#hud{position:fixed;top:18px;left:50%;transform:translateX(-50%);padding:14px 22px;border-radius:24px;background:rgba(0,0,0,.35);backdrop-filter:blur(18px);color:#fff;z-index:9;text-align:center;border:1px solid rgba(0,255,255,.2)}#mode{font-size:13px;color:#63f3ff;margin-top:4px}#logo{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);font-size:40px;letter-spacing:10px;font-weight:700;color:rgba(255,255,255,.08);z-index:3;text-shadow:0 0 25px #00f7ff}body:before{content:'';position:fixed;inset:0;background:radial-gradient(circle at center,rgba(0,255,255,.08),transparent 55%),linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:100% 100%,40px 40px,40px 40px;pointer-events:none}</style></head><body><video id='video' autoplay playsinline muted></video><canvas id='c'></canvas><div id='hud'>AI 粒子交互装置<div id='mode'>模式: Cyber Fluid</div></div><div id='logo'>OPENCLAW</div><script type='module'>import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/controls/OrbitControls.js';import {PoseLandmarker,HandLandmarker,FilesetResolver} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';const canvas=document.getElementById('c');const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(devicePixelRatio);renderer.setSize(innerWidth,innerHeight);const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,2000);camera.position.z=120;const group=new THREE.Group();scene.add(group);const ambient=new THREE.AmbientLight(0xffffff,1.2);scene.add(ambient);const count=12000;const geo=new THREE.BufferGeometry();const pos=new Float32Array(count*3);const base=[];for(let i=0;i<count;i++){let a=Math.random()*Math.PI*2;let r=Math.random()*55;let x=Math.cos(a)*r*(Math.random()*2);let y=Math.sin(a)*r*(Math.random()*2);let z=(Math.random()-.5)*90;pos[i*3]=x;pos[i*3+1]=y;pos[i*3+2]=z;base.push({x,y,z})}geo.setAttribute('position',new THREE.BufferAttribute(pos,3));const mat=new THREE.PointsMaterial({size:1.2,color:0x55eeff,transparent:true,opacity:.95,blending:THREE.AdditiveBlending});const points=new THREE.Points(geo,mat);group.add(points);const logoCanvas=document.createElement('canvas');logoCanvas.width=1200;logoCanvas.height=300;const lctx=logoCanvas.getContext('2d');lctx.fillStyle='black';lctx.fillRect(0,0,1200,300);lctx.font='bold 180px Arial';lctx.fillStyle='white';lctx.textAlign='center';lctx.fillText('OPENCLAW',600,200);const data=lctx.getImageData(0,0,1200,300).data;const logoTargets=[];for(let y=0;y<300;y+=4){for(let x=0;x<1200;x+=4){const idx=(y*1200+x)*4;if(data[idx]>200){logoTargets.push({x:(x-600)/6,y:(150-y)/6,z:(Math.random()-.5)*12})}}}const video=document.getElementById('video');const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream;await video.play();const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');const hand=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'},runningMode:'VIDEO',numHands:2});const pose=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task'},runningMode:'VIDEO',numPoses:1});let mode=0;const modeNames=['Cyber Fluid','Fire Smoke','Logo Morph','AI Avatar'];addEventListener('click',()=>{mode=(mode+1)%4;document.getElementById('mode').innerText='模式: '+modeNames[mode]});let audioLevel=0;try{const audio=await navigator.mediaDevices.getUserMedia({audio:true});const ctx=new AudioContext();const analyser=ctx.createAnalyser();const mic=ctx.createMediaStreamSource(audio);mic.connect(analyser);const arr=new Uint8Array(analyser.frequencyBinCount);setInterval(()=>{analyser.getByteFrequencyData(arr);audioLevel=arr.reduce((a,b)=>a+b,0)/arr.length/255},40)}catch(e){}function animate(t){requestAnimationFrame(animate);group.rotation.y+=0.0015;const positions=geo.attributes.position.array;const handRes=hand.detectForVideo(video,performance.now());const poseRes=pose.detectForVideo(video,performance.now());for(let i=0;i<count;i++){let ix=i*3;let p=base[i];let tx=p.x,ty=p.y,tz=p.z;if(mode===1){tx+=Math.sin(t*.001+p.y*.1)*10;ty+=Math.cos(t*.001+p.x*.1)*10;tz+=Math.sin(t*.002+p.z*.1)*20}else if(mode===2&&logoTargets[i%logoTargets.length]){let l=logoTargets[i%logoTargets.length];tx=l.x*1.4;ty=l.y*1.4;tz=l.z}else if(mode===3&&poseRes.landmarks&&poseRes.landmarks[0]){let lm=poseRes.landmarks[0][i%33];tx=(lm.x-.5)*180;ty=(.5-lm.y)*320;tz=(lm.z||0)*120}positions[ix]+=(tx-positions[ix])*.03;positions[ix+1]+=(ty-positions[ix+1])*.03;positions[ix+2]+=(tz-positions[ix+2])*.03;if(handRes.landmarks){for(const h of handRes.landmarks){for(const pt of h){const hx=(0.5-pt.x)*220;const hy=(0.5-pt.y)*420;const dx=positions[ix]-hx;const dy=positions[ix+1]-hy;const dist=Math.sqrt(dx*dx+dy*dy);if(dist<40){positions[ix]+=dx*.06;positions[ix+1]+=dy*.06}}}}positions[ix+2]+=Math.sin(t*.001+i)*audioLevel*1.8}geo.attributes.position.needsUpdate=true;renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>

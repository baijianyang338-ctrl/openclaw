<!DOCTYPE html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no'><title>AI Vision Particle</title><style>html,body{margin:0;overflow:hidden;background:#02030a;font-family:-apple-system,BlinkMacSystemFont,sans-serif}canvas,video{position:fixed;inset:0;width:100%;height:100%}video{object-fit:cover;opacity:.05;transform:scaleX(-1)}#hud{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:10;padding:14px 22px;background:rgba(0,0,0,.35);backdrop-filter:blur(18px);border:1px solid rgba(0,255,255,.25);border-radius:22px;color:#fff;text-align:center}#mode{color:#6df5ff;font-size:13px;margin-top:4px}body:before{content:'';position:fixed;inset:0;background:radial-gradient(circle at center,rgba(0,255,255,.08),transparent 55%),linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:100% 100%,42px 42px,42px 42px;pointer-events:none}</style></head><body><video id='video' autoplay playsinline muted></video><canvas id='c'></canvas><div id='hud'>AI Vision 粒子识别<div id='mode'>模式: Object Contour</div></div><script type='module'>import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';import {HandLandmarker,FilesetResolver} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';const canvas=document.getElementById('c');const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(devicePixelRatio);const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,2000);camera.position.z=140;const particles=22000;const geometry=new THREE.BufferGeometry();const positions=new Float32Array(particles*3);const velocity=[];for(let i=0;i<particles;i++){positions[i*3]=(Math.random()-.5)*220;positions[i*3+1]=(Math.random()-.5)*220;positions[i*3+2]=(Math.random()-.5)*120;velocity.push({x:0,y:0,z:0})}geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));const material=new THREE.PointsMaterial({size:1.05,color:0x66eeff,transparent:true,opacity:.92,blending:THREE.AdditiveBlending});const cloud=new THREE.Points(geometry,material);scene.add(cloud);const video=document.getElementById('video');const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream;await video.play();const off=document.createElement('canvas');const octx=off.getContext('2d',{willReadFrequently:true});off.width=160;off.height=120;const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');const hand=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'},runningMode:'VIDEO',numHands:2});let contour=[];function buildContour(){octx.save();octx.scale(-1,1);octx.drawImage(video,-160,0,160,120);octx.restore();const img=octx.getImageData(0,0,160,120).data;contour=[];for(let y=1;y<119;y+=2){for(let x=1;x<159;x+=2){const i=(y*160+x)*4;const b=(img[i]+img[i+1]+img[i+2])/3;const i2=((y+1)*160+(x+1))*4;const b2=(img[i2]+img[i2+1]+img[i2+2])/3;const diff=Math.abs(b-b2);if(diff>28){contour.push({x:(x-80)*1.6,y:(60-y)*1.9,z:(Math.random()-.5)*18})}}}}setInterval(buildContour,60);let time=0;function animate(){requestAnimationFrame(animate);time+=0.01;const pos=geometry.attributes.position.array;const hands=hand.detectForVideo(video,performance.now()).landmarks||[];for(let i=0;i<particles;i++){const idx=i*3;const v=velocity[i];let target=contour[i%Math.max(contour.length,1)]||{x:0,y:0,z:0};let tx=target.x+Math.sin(time+i*.001)*4;let ty=target.y+Math.cos(time+i*.001)*4;let tz=target.z+Math.sin(time+i*.002)*8;for(const h of hands){for(const p of h){const hx=(0.5-p.x)*260;const hy=(0.5-p.y)*420;const dx=pos[idx]-hx;const dy=pos[idx+1]-hy;const dist=Math.sqrt(dx*dx+dy*dy);if(dist<55){v.x+=dx*.02;v.y+=dy*.02}}}v.x+=(tx-pos[idx])*.002;v.y+=(ty-pos[idx+1])*.002;v.z+=(tz-pos[idx+2])*.002;v.x*=.92;v.y*=.92;v.z*=.92;pos[idx]+=v.x;pos[idx+1]+=v.y;pos[idx+2]+=v.z}geometry.attributes.position.needsUpdate=true;cloud.rotation.y=Math.sin(time*.3)*.12;renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>

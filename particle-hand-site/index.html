<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>A18 AI Particle Engine</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030a;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif;color:white;touch-action:none}#stage,#video{position:fixed;inset:0;width:100%;height:100%}#video{object-fit:cover;transform:scaleX(-1);opacity:.055;filter:contrast(1.2) saturate(1.1)}#stage{z-index:2}.vignette{position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(circle at 50% 45%,transparent 0,rgba(0,210,255,.05) 38%,rgba(0,0,0,.68) 100%),linear-gradient(135deg,rgba(0,255,255,.055),transparent 35%,rgba(120,0,255,.08))}.grid{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:.24;background-image:linear-gradient(rgba(120,240,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(120,240,255,.08) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(circle at center,#000 0,transparent 70%)}#hud{position:fixed;left:50%;top:max(18px,env(safe-area-inset-top));transform:translateX(-50%);z-index:8;width:min(92vw,460px);padding:14px 18px;border-radius:24px;background:rgba(2,8,18,.42);border:1px solid rgba(150,245,255,.2);box-shadow:0 0 60px rgba(0,225,255,.12),inset 0 0 24px rgba(255,255,255,.035);backdrop-filter:blur(22px);text-align:center}.title{font-size:17px;font-weight:700;letter-spacing:.08em}.mode{margin-top:5px;color:#72f6ff;font-size:13px}.meta{margin-top:5px;color:rgba(255,255,255,.62);font-size:11px}#start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,rgba(0,230,255,.12),rgba(0,0,0,.92));padding:24px}.panel{width:min(92vw,430px);border-radius:28px;padding:28px 22px;text-align:center;background:rgba(5,10,22,.68);border:1px solid rgba(120,240,255,.22);box-shadow:0 0 80px rgba(0,220,255,.18);backdrop-filter:blur(26px)}.panel h1{font-size:25px;margin:0 0 10px}.panel p{font-size:14px;color:rgba(255,255,255,.72);line-height:1.7}.btn{margin-top:18px;border:0;border-radius:999px;padding:14px 26px;background:linear-gradient(135deg,#7df9ff,#7a6cff);color:#001018;font-weight:800;font-size:15px}.dock{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;display:flex;gap:8px;padding:8px;border-radius:22px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(18px)}.chip{padding:8px 10px;border-radius:16px;font-size:11px;color:rgba(255,255,255,.72);background:rgba(255,255,255,.06)}.chip.on{color:#001018;background:#79f7ff;font-weight:800}@media(max-width:430px){.title{font-size:15px}.dock{max-width:95vw;overflow:hidden}.chip{padding:7px 8px;font-size:10px}}</style></head><body><video id="video" autoplay playsinline muted></video><canvas id="stage"></canvas><div class="vignette"></div><div class="grid"></div><div id="hud"><div class="title">A18 AI PARTICLE ENGINE</div><div id="mode" class="mode">Object Contour · 摄像头轮廓粒子化</div><div id="meta" class="meta">iPhone 16 Pro 高性能展览模式 · 点击底部切换</div></div><div class="dock"><div class="chip on" data-m="0">轮廓</div><div class="chip" data-m="1">数字人</div><div class="chip" data-m="2">发布会</div><div class="chip" data-m="3">流体</div><div class="chip" data-m="4">星云</div></div><div id="start"><div class="panel"><h1>AI 艺术展粒子引擎</h1><p>调用摄像头后，系统会把人物、手部和画面边缘实时重构成空间粒子。适配 iPhone 16 Pro / A18，优先保证流畅和展览视觉。</p><button class="btn">启动摄像头与粒子引擎</button></div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';import {HandLandmarker,PoseLandmarker,FilesetResolver} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';const canvas=document.getElementById('stage'),video=document.getElementById('video'),modeEl=document.getElementById('mode'),meta=document.getElementById('meta'),start=document.getElementById('start');const modeText=['Object Contour · 摄像头轮廓粒子化','Digital Human · 数字人动作捕捉','Apple Keynote · 苹果发布会概念视觉','Museum Fluid · 科技馆体感流体','Neural Nebula · AI 星云空间'];let mode=0,started=false;document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{mode=+c.dataset.m;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');modeEl.textContent=modeText[mode]});const renderer=new THREE.WebGLRenderer({canvas,antialias:false,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x02030a,.006);const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.1,900);camera.position.z=135;scene.add(new THREE.AmbientLight(0xffffff,1.1));const isPro=/iPhone/.test(navigator.userAgent);const COUNT=isPro?24000:16000;const geo=new THREE.BufferGeometry();const pos=new Float32Array(COUNT*3),vel=new Float32Array(COUNT*3),base=new Float32Array(COUNT*3),seed=new Float32Array(COUNT);for(let i=0;i<COUNT;i++){const a=Math.random()*Math.PI*2,r=18+Math.random()*75,z=(Math.random()-.5)*105;const x=Math.cos(a)*r*(.65+Math.random()),y=Math.sin(a)*r*(.65+Math.random());pos[i*3]=x;pos[i*3+1]=y;pos[i*3+2]=z;base[i*3]=x;base[i*3+1]=y;base[i*3+2]=z;seed[i]=Math.random()*1000}geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('aSeed',new THREE.BufferAttribute(seed,1));const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:{uTime:{value:0},uMode:{value:0},uSize:{value:isPro?2.25:1.8},uColorA:{value:new THREE.Color('#7df9ff')},uColorB:{value:new THREE.Color('#8a72ff')}},vertexShader:`attribute float aSeed;uniform float uTime;uniform float uSize;varying float vSeed;varying float vDepth;void main(){vSeed=aSeed;vec3 p=position;vec4 mv=modelViewMatrix*vec4(p,1.0);vDepth=1.0-smoothstep(20.0,190.0,-mv.z);gl_PointSize=uSize*(160.0/-mv.z)*(0.72+0.45*sin(aSeed+uTime*2.0));gl_Position=projectionMatrix*mv;}`,fragmentShader:`uniform vec3 uColorA;uniform vec3 uColorB;uniform float uTime;varying float vSeed;varying float vDepth;void main(){vec2 uv=gl_PointCoord-.5;float d=length(uv);float core=smoothstep(.5,0.0,d);float halo=smoothstep(.5,.12,d)*.45;vec3 col=mix(uColorA,uColorB,.5+.5*sin(vSeed*.17+uTime));float alpha=(core+halo)*(.52+.48*vDepth);gl_FragColor=vec4(col,alpha);}`});const cloud=new THREE.Points(geo,mat);scene.add(cloud);const ringGeo=new THREE.TorusGeometry(85,.08,8,180);const ringMat=new THREE.MeshBasicMaterial({color:0x70f7ff,transparent:true,opacity:.18,blending:THREE.AdditiveBlending});const rings=[];for(let i=0;i<4;i++){const r=new THREE.Mesh(ringGeo,ringMat.clone());r.rotation.x=Math.PI/2+i*.34;r.rotation.z=i*.52;r.scale.setScalar(.65+i*.18);scene.add(r);rings.push(r)}const off=document.createElement('canvas');off.width=112;off.height=84;const ox=off.getContext('2d',{willReadFrequently:true});let contour=new Float32Array(3000),contourCount=0,hands=[],body=[],vision,hand,pose,lastAI=0,lastContour=0,fps=0,frames=0,lastFps=performance.now();function rebuildContour(){ox.save();ox.scale(-1,1);ox.drawImage(video,-112,0,112,84);ox.restore();const img=ox.getImageData(0,0,112,84).data;let n=0;for(let y=1;y<83;y+=2){for(let x=1;x<111;x+=2){const i=(y*112+x)*4;const b=(img[i]+img[i+1]+img[i+2])/3;const rx=i+4,dy=i+112*4;const br=(img[rx]+img[rx+1]+img[rx+2])/3;const bd=(img[dy]+img[dy+1]+img[dy+2])/3;const e=Math.abs(b-br)+Math.abs(b-bd);if(e>42&&n<1000){contour[n*3]=(x-56)*2.15;contour[n*3+1]=(42-y)*2.75;contour[n*3+2]=(Math.random()-.5)*12;n++}}}contourCount=n}async function boot(){start.style.display='none';const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480},frameRate:{ideal:30,max:30}},audio:false});video.srcObject=stream;await video.play();vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');hand=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'},runningMode:'VIDEO',numHands:2});pose=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task'},runningMode:'VIDEO',numPoses:1});started=true}document.querySelector('.btn').onclick=boot;function targetFor(i,t){const k=i*3;let tx=base[k],ty=base[k+1],tz=base[k+2];if(mode===0&&contourCount>10){const ci=(i%contourCount)*3;tx=contour[ci];ty=contour[ci+1];tz=contour[ci+2]+Math.sin(t*2+i*.01)*8}else if(mode===1&&body.length){const b=body[i%33];tx=(.5-b.x)*170;ty=(.5-b.y)*270;tz=(b.z||0)*85+Math.sin(i)*12}else if(mode===2){const a=i*.0027+t*.55;const layer=(i%7)/7;tx=Math.cos(a)*(38+layer*58);ty=Math.sin(a*1.45)*(22+layer*48);tz=Math.sin(a*.9)*80}else if(mode===3){tx+=Math.sin(t*2.2+base[k+1]*.035+i*.003)*32;ty+=Math.cos(t*2.0+base[k]*.035+i*.004)*32;tz+=Math.sin(t*1.4+i*.012)*38}else if(mode===4){const a=seed[i]*.01+t*.25,r=35+50*Math.sin(seed[i]*.13+t*.35);tx=Math.cos(a)*r+Math.sin(t+seed[i]) *16;ty=Math.sin(a*1.7)*r*.72;tz=Math.cos(a*.6)*90}return[tx,ty,tz]}function animate(now){requestAnimationFrame(animate);const t=now*.001;mat.uniforms.uTime.value=t;mat.uniforms.uMode.value=mode;if(started&&now-lastContour>72){rebuildContour();lastContour=now}if(started&&hand&&now-lastAI>110){try{hands=hand.detectForVideo(video,now).landmarks||[];body=pose.detectForVideo(video,now).landmarks?.[0]||[]}catch(e){}lastAI=now}const p=geo.attributes.position.array;for(let i=0;i<COUNT;i++){const k=i*3;const tar=targetFor(i,t);let tx=tar[0],ty=tar[1],tz=tar[2];for(let hi=0;hi<hands.length;hi++){const h=hands[hi];for(let j=0;j<h.length;j+=2){const hp=h[j],hx=(.5-hp.x)*210,hy=(.5-hp.y)*330,dx=p[k]-hx,dy=p[k+1]-hy,d2=dx*dx+dy*dy;if(d2<2300){const f=(1-d2/2300)*.018;vel[k]+=dx*f;vel[k+1]+=dy*f;vel[k+2]+=Math.sin(seed[i]+t)*f*80}}}vel[k]+=(tx-p[k])*.0085;vel[k+1]+=(ty-p[k+1])*.0085;vel[k+2]+=(tz-p[k+2])*.0085;vel[k]*=.895;vel[k+1]*=.895;vel[k+2]*=.895;p[k]+=vel[k];p[k+1]+=vel[k+1];p[k+2]+=vel[k+2]}geo.attributes.position.needsUpdate=true;cloud.rotation.y=Math.sin(t*.23)*.12;cloud.rotation.x=Math.sin(t*.17)*.035;rings.forEach((r,i)=>{r.rotation.z+=.0015+i*.0008;r.material.opacity=.10+.08*Math.sin(t+i)});renderer.render(scene,camera);frames++;if(now-lastFps>1000){fps=frames;frames=0;lastFps=now;meta.textContent=`A18 展览引擎 · ${COUNT} 粒子 · ${fps} FPS · 轮廓点 ${contourCount}`}}animate(performance.now());addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>

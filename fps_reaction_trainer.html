<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>FPS反应训练小游戏</title><style>*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#050816;color:#eaf6ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;user-select:none;touch-action:none}button{font:inherit;border:0;color:inherit;cursor:pointer}.screen{position:fixed;inset:0;display:grid;place-items:center;transition:.4s;opacity:0;pointer-events:none}.screen.on{opacity:1;pointer-events:auto}canvas{position:fixed;inset:0;width:100%;height:100%}#bg{z-index:0}.home{z-index:2;background:radial-gradient(circle at 50% 35%,rgba(44,135,255,.35),transparent 35%),linear-gradient(135deg,rgba(25,247,255,.08),rgba(255,61,242,.06))}.card{width:min(980px,92vw);min-height:min(650px,88vh);border:1px solid rgba(255,255,255,.18);border-radius:34px;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.045));box-shadow:0 0 70px rgba(25,247,255,.15),inset 0 0 35px rgba(255,255,255,.05);backdrop-filter:blur(18px);padding:clamp(24px,5vw,60px);display:grid;grid-template-columns:1fr 360px;gap:35px;align-items:center;overflow:hidden;position:relative}.tag{display:inline-flex;gap:9px;align-items:center;border:1px solid rgba(25,247,255,.35);border-radius:999px;padding:9px 14px;color:#9dfcff;background:rgba(25,247,255,.08);font-weight:800;letter-spacing:.08em}.tag:before{content:'';width:8px;height:8px;border-radius:50%;background:#4dff9d;box-shadow:0 0 18px #4dff9d}h1{font-size:clamp(44px,8vw,86px);line-height:.95;margin:25px 0 18px;letter-spacing:-.06em;text-shadow:0 0 24px rgba(25,247,255,.35)}h1 span{display:block;background:linear-gradient(90deg,#fff,#8dfaff,#a78bff,#ff8bf8);-webkit-background-clip:text;color:transparent}.sub{color:rgba(234,246,255,.7);font-size:18px;line-height:1.75;max-width:590px}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0}.rule{border:1px solid rgba(255,255,255,.13);border-radius:18px;padding:14px;background:rgba(255,255,255,.06)}.rule b{display:block;margin-bottom:6px}.rule small{color:rgba(234,246,255,.58);line-height:1.45}.btn{padding:16px 26px;border-radius:18px;font-weight:900;letter-spacing:.08em;background:linear-gradient(135deg,#7effff,#4d8cff 48%,#d56cff);color:#061221;box-shadow:0 0 28px rgba(25,247,255,.35)}.ghost{margin-left:12px;padding:15px 20px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:rgba(234,246,255,.78)}.orb{height:420px;position:relative;display:grid;place-items:center;perspective:850px}.ball{width:280px;height:280px;border-radius:50%;position:relative;transform-style:preserve-3d;animation:float 4s ease-in-out infinite}.ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(25,247,255,.45);box-shadow:0 0 30px rgba(25,247,255,.25);animation:spin 6s linear infinite}.r2{transform:rotateY(62deg);border-color:rgba(155,92,255,.48);animation-duration:7s}.r3{transform:rotateX(70deg);border-color:rgba(255,61,242,.42);animation-duration:5s}.core{position:absolute;inset:27%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9dfcff 18%,#4d8cff 45%,#7a4dff 68%,#050816);box-shadow:0 0 45px rgba(25,247,255,.85),0 0 90px rgba(155,92,255,.5)}@keyframes spin{to{rotate:360deg}}@keyframes float{50%{transform:translateY(-20px) rotateX(18deg) rotateY(25deg)}}#game{z-index:1;background:radial-gradient(circle at 50% 50%,rgba(25,247,255,.13),transparent 25%),linear-gradient(to bottom,rgba(5,8,22,.2),rgba(5,8,22,.86))}.hud{position:fixed;z-index:4;top:16px;left:16px;right:16px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;pointer-events:none}.box{padding:12px 14px;border-radius:18px;border:1px solid rgba(255,255,255,.15);background:rgba(4,12,30,.55);backdrop-filter:blur(14px)}.box small{display:block;color:rgba(234,246,255,.58);font-size:12px;letter-spacing:.08em}.box b{display:block;margin-top:4px;font-size:clamp(18px,2.3vw,28px)}.hot{color:#8dfaff;text-shadow:0 0 18px rgba(25,247,255,.55)}.cross{position:fixed;z-index:3;left:50%;top:50%;width:54px;height:54px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 10px #19f7ff);pointer-events:none}.cross:before,.cross:after{content:'';position:absolute;left:50%;top:50%;background:#9dfcff;transform:translate(-50%,-50%)}.cross:before{width:2px;height:54px}.cross:after{width:54px;height:2px}.tip{position:fixed;z-index:4;left:16px;bottom:16px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(4,12,30,.5);padding:11px 14px;color:rgba(234,246,255,.68);font-size:13px}.pause{position:fixed;z-index:4;right:16px;bottom:16px;width:54px;height:54px;border-radius:18px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(12px)}.modal{position:fixed;z-index:8;inset:0;display:grid;place-items:center;background:rgba(1,5,15,.7);backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:.25s}.modal.show{opacity:1;pointer-events:auto}.panel{width:min(520px,90vw);border-radius:28px;padding:28px;border:1px solid rgba(255,255,255,.16);background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.045));box-shadow:0 0 50px rgba(25,247,255,.12)}.panel h2{font-size:34px;margin-bottom:12px}.panel p{color:rgba(234,246,255,.68);line-height:1.7}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}.item{padding:14px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}.item small{display:block;color:rgba(234,246,255,.58);margin-bottom:6px}.item strong{font-size:26px}.pop{position:fixed;z-index:7;font-weight:950;color:#9dfcff;text-shadow:0 0 14px rgba(25,247,255,.8);pointer-events:none;animation:pop .7s forwards}.bad{color:#ff8095;text-shadow:0 0 14px rgba(255,77,109,.7)}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}20%{opacity:1;transform:translate(-50%,-80%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-130%) scale(.9)}}@media(max-width:800px){.card{grid-template-columns:1fr;min-height:92vh;padding:24px}.orb{order:-1;height:240px}.ball{width:210px;height:210px}.rules{grid-template-columns:1fr}.hud{grid-template-columns:repeat(2,1fr);top:10px;left:10px;right:10px}.box:nth-child(5){grid-column:span 2}.tip{max-width:72vw;border-radius:18px;line-height:1.4}}</style></head><body><canvas id="bg"></canvas><section id="home" class="screen home on"><div class="card"><div><div class="tag">3D AIM TRAINER</div><h1>FPS反应<br><span>极限训练场</span></h1><p class="sub">点击高速移动的小目标。你的分数越高，目标越快、越小、越不规则。训练手眼协调、预判和瞬间反应。</p><div class="rules"><div class="rule"><b>45秒限时</b><small>尽可能多命中目标。</small></div><div class="rule"><b>越打越快</b><small>速度和难度持续升级。</small></div><div class="rule"><b>数据评分</b><small>统计命中率、反应时间、连击。</small></div></div><button class="btn" id="start">开始训练</button><button class="ghost" id="endless">无尽模式</button></div><div class="orb"><div class="ball"><i class="ring r1"></i><i class="ring r2"></i><i class="ring r3"></i><i class="core"></i></div></div></div></section><section id="play" class="screen"><canvas id="game"></canvas><div class="hud"><div class="box"><small>时间</small><b class="hot" id="time">45.0</b></div><div class="box"><small>得分</small><b id="score">0</b></div><div class="box"><small>命中率</small><b id="acc">100%</b></div><div class="box"><small>平均反应</small><b id="rt">--</b></div><div class="box"><small>难度速度</small><b id="spd">1.0x</b></div></div><div class="cross"></div><div class="tip">电脑鼠标点击｜手机手指点｜Esc暂停</div><button class="pause" id="pause">Ⅱ</button></section><div class="modal" id="modal"><div class="panel"><h2 id="title">训练完成</h2><p id="comment">你的反应数据如下。</p><div class="grid"><div class="item"><small>最终得分</small><strong id="fs">0</strong></div><div class="item"><small>命中率</small><strong id="fa">0%</strong></div><div class="item"><small>平均反应</small><strong id="fr">--</strong></div><div class="item"><small>最大连击</small><strong id="fc">0</strong></div></div><button class="btn" id="again">再来一局</button><button class="ghost" id="back">返回主页</button></div></div><script>(()=>{const $=id=>document.getElementById(id),bg=$('bg'),bc=bg.getContext('2d'),cv=$('game'),c=cv.getContext('2d');let W,H,D=Math.min(devicePixelRatio||1,2),stars=[],running=false,paused=false,endless=false,last=0,S={time:45,score:0,shots:0,hits:0,miss:0,combo:0,max:0,react:0,n:0,target:null,spawn:0,parts:[],rings:[]};function size(){W=innerWidth;H=innerHeight;for(const x of [bg,cv]){x.width=W*D;x.height=H*D;x.style.width=W+'px';x.style.height=H+'px';x.getContext('2d').setTransform(D,0,0,D,0,0)}stars=Array.from({length:Math.min(230,Math.max(90,W*H/9000))},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()+.25,r:Math.random()*1.6+.3,v:.12+Math.random()*.48,t:Math.random()*7}))}function space(t){bc.clearRect(0,0,W,H);let g=bc.createRadialGradient(W*.5,H*.45,0,W*.5,H*.5,Math.max(W,H)*.75);g.addColorStop(0,'rgba(15,52,120,.22)');g.addColorStop(1,'rgba(0,0,0,.25)');bc.fillStyle=g;bc.fillRect(0,0,W,H);for(const s of stars){s.y+=s.v*s.z;s.t+=.04;if(s.y>H+5){s.y=-5;s.x=Math.random()*W}bc.beginPath();bc.fillStyle=`rgba(160,245,255,${.25+Math.abs(Math.sin(s.t))*.6})`;bc.arc(s.x,s.y,s.r*s.z,0,7);bc.fill()}requestAnimationFrame(space)}function target(){let top=H<700?130:105,m=Math.max(45,Math.min(W,H)*.07),r=Math.max(15,42-S.score*.45),sp=(110+S.score*8+S.combo*2.8)*(H<700?.88:1),a=Math.random()*7;S.spawn=performance.now();return{x:m+Math.random()*Math.max(1,W-m*2),y:top+Math.random()*Math.max(1,H-top-m-82),r,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,h:175+Math.random()*120,rot:0}}function start(e=false){endless=e;Object.assign(S,{time:e?99999:45,score:0,shots:0,hits:0,miss:0,combo:0,max:0,react:0,n:0,parts:[],rings:[]});S.target=target();running=true;paused=false;last=performance.now();$('home').classList.remove('on');$('play').classList.add('on');$('modal').classList.remove('show');requestAnimationFrame(loop)}function hud(){let a=S.shots?Math.round(S.hits/S.shots*100):100,rt=S.n?Math.round(S.react/S.n):0,sp=1+S.score*.038+S.combo*.012;$('time').textContent=endless?'∞':Math.max(0,S.time).toFixed(1);$('score').textContent=S.score;$('acc').textContent=a+'%';$('rt').textContent=rt?rt+'ms':'--';$('spd').textContent=sp.toFixed(1)+'x';return sp}function loop(n){if(!running)return;let dt=Math.min(.033,(n-last)/1000||0);last=n;if(!paused){upd(dt);draw(n);hud();if(!endless&&(S.time-=dt)<=0)return done()}requestAnimationFrame(loop)}function upd(dt){let t=S.target,sp=1+S.score*.038+S.combo*.012;t.x+=t.vx*sp*dt;t.y+=t.vy*sp*dt;t.rot+=dt*5*sp;let top=H<700?118:92,bot=H-76;if(t.x<t.r||t.x>W-t.r){t.vx*=-1;t.x=Math.max(t.r,Math.min(W-t.r,t.x));S.rings.push({x:t.x,y:t.y,r:8,a:.5})}if(t.y<top+t.r||t.y>bot-t.r){t.vy*=-1;t.y=Math.max(top+t.r,Math.min(bot-t.r,t.y));S.rings.push({x:t.x,y:t.y,r:8,a:.5})}if(S.score>8&&Math.random()<.012+S.score*.001){let a=Math.atan2(t.vy,t.vx)+(Math.random()-.5)*1.35,v=Math.hypot(t.vx,t.vy);t.vx=Math.cos(a)*v;t.vy=Math.sin(a)*v}for(let i=S.parts.length-1;i>=0;i--){let p=S.parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=90*dt;p.life-=dt;if(p.life<=0)S.parts.splice(i,1)}for(let i=S.rings.length-1;i>=0;i--){let r=S.rings[i];r.r+=180*dt;r.a-=1.1*dt;if(r.a<=0)S.rings.splice(i,1)}}function draw(n){c.clearRect(0,0,W,H);c.save();c.translate(W/2,H/2);for(let i=0;i<70;i++){let a=i/70*7+n*.00009,r0=110+Math.sin(n*.001+i)*22,r1=Math.max(W,H)*(.55+(i%9)*.014);c.beginPath();c.strokeStyle=`rgba(25,247,255,${.028+(i%4)*.007})`;c.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);c.lineTo(Math.cos(a)*r1,Math.sin(a)*r1);c.stroke()}c.restore();let h=H*.58;c.strokeStyle='rgba(25,247,255,.12)';for(let i=0;i<16;i++){let y=h+Math.pow(i/15,1.8)*H*.45;c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}for(let i=-12;i<=12;i++){c.beginPath();c.moveTo(W/2,h);c.lineTo(W/2+i*W*.11,H);c.stroke()}for(const r of S.rings){c.beginPath();c.strokeStyle=`rgba(141,250,255,${r.a})`;c.lineWidth=2;c.arc(r.x,r.y,r.r,0,7);c.stroke()}drawT(S.target,n);for(const p of S.parts){c.beginPath();c.fillStyle=`rgba(150,245,255,${p.life/p.max})`;c.arc(p.x,p.y,p.r,0,7);c.fill()}}function drawT(t,n){let r=t.r*(1+Math.sin(n*.009)*.08),g=c.createRadialGradient(t.x,t.y,0,t.x,t.y,r*3.2);g.addColorStop(0,`hsla(${t.h},100%,70%,.65)`);g.addColorStop(.28,`hsla(${t.h},100%,58%,.25)`);g.addColorStop(1,`hsla(${t.h},100%,55%,0)`);c.beginPath();c.fillStyle=g;c.arc(t.x,t.y,r*3.2,0,7);c.fill();c.save();c.translate(t.x,t.y);c.rotate(t.rot);let b=c.createRadialGradient(-r*.35,-r*.35,0,0,0,r);b.addColorStop(0,'#fff');b.addColorStop(.22,`hsl(${t.h},100%,78%)`);b.addColorStop(.56,`hsl(${t.h},100%,52%)`);b.addColorStop(1,'#051026');c.beginPath();c.fillStyle=b;c.arc(0,0,r,0,7);c.fill();c.strokeStyle='rgba(255,255,255,.88)';c.lineWidth=Math.max(1.5,r*.08);c.beginPath();c.arc(0,0,r*.58,0,7);c.stroke();c.beginPath();c.moveTo(-r*.88,0);c.lineTo(-r*.3,0);c.moveTo(r*.3,0);c.lineTo(r*.88,0);c.moveTo(0,-r*.88);c.lineTo(0,-r*.3);c.moveTo(0,r*.3);c.lineTo(0,r*.88);c.stroke();c.restore()}function shot(x,y){if(!running||paused)return;let r=cv.getBoundingClientRect(),px=x-r.left,py=y-r.top,t=S.target;S.shots++;if(Math.hypot(px-t.x,py-t.y)<=t.r*1.15){let rt=performance.now()-S.spawn;S.hits++;S.score++;S.combo++;S.max=Math.max(S.max,S.combo);S.react+=rt;S.n++;boom(t.x,t.y);txt(t.x,t.y,'+1  '+Math.round(rt)+'ms');S.target=target();if(!endless&&S.combo%10===0){S.time=Math.min(45,S.time+2);txt(px,py-24,'连击+2秒')}}else{S.miss++;S.combo=0;S.rings.push({x:px,y:py,r:5,a:.5});txt(px,py,'MISS',1)}}function boom(x,y){for(let i=0;i<28;i++){let a=Math.random()*7,v=110+Math.random()*350;S.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:1.8+Math.random()*3.4,life:.35+Math.random()*.45,max:.8})}S.rings.push({x,y,r:12,a:.8})}function txt(x,y,s,b){let e=document.createElement('div');e.className='pop '+(b?'bad':'');e.textContent=s;e.style.left=x+'px';e.style.top=y+'px';document.body.append(e);setTimeout(()=>e.remove(),720)}function done(){running=false;let a=S.shots?Math.round(S.hits/S.shots*100):0,rt=S.n?Math.round(S.react/S.n):0;$('fs').textContent=S.score;$('fa').textContent=a+'%';$('fr').textContent=rt?rt+'ms':'--';$('fc').textContent=S.max;$('comment').textContent=S.score>=55&&a>=82?'非常猛，已经像竞技FPS里的枪法热身成绩了。':S.score>=38&&a>=75?'不错，反应和稳定性都有基础。':S.score>=22?'有手感了，下一步重点减少MISS。':'继续练习，先保证不乱点，再追求速度。';$('modal').classList.add('show')}function home(){running=false;$('play').classList.remove('on');$('home').classList.add('on');$('modal').classList.remove('show')}$('start').onclick=()=>start(false);$('endless').onclick=()=>start(true);$('again').onclick=()=>start(endless);$('back').onclick=home;$('pause').onclick=()=>paused=!paused;cv.addEventListener('pointerdown',e=>{e.preventDefault();shot(e.clientX,e.clientY)},{passive:false});onkeydown=e=>{if(e.key==='Escape')paused=!paused;if(e.code==='Space'&&$('home').classList.contains('on'))start(false)};onresize=size;size();requestAnimationFrame(space)})();</script></body></html>

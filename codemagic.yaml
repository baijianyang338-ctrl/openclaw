workflows:
  ios-native-unsigned:
    name: OpenClaw Vision - unsigned validation
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: ios_mobile_kit/OpenClawVision/OpenClawVision.xcodeproj
        XCODE_SCHEME: OpenClawVision
    cache:
      cache_paths:
        - $HOME/Library/Developer/Xcode/DerivedData
    scripts:
      - name: Test Mock ESP32 protocol
        script: |
          set -euo pipefail
          python3 -m unittest discover -s mock_esp32/tests -v
      - name: Show Xcode environment
        script: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks
      - name: Test local rule extraction and consensus
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build"
          swiftc \
            "$CM_BUILD_DIR/ios_mobile_kit/OpenClawVision/OpenClawVision/Shared/AppConstants.swift" \
            "$CM_BUILD_DIR/ios_mobile_kit/OpenClawVision/OpenClawVision/Shared/OCRResult.swift" \
            "$CM_BUILD_DIR/ios_mobile_kit/OpenClawVision/OpenClawVision/Shared/RuleExtractor.swift" \
            "$CM_BUILD_DIR/ios_mobile_kit/OpenClawVision/Tests/main.swift" \
            -o "$CM_BUILD_DIR/build/rule-tests"
          "$CM_BUILD_DIR/build/rule-tests"
      - name: Validate project and shared scheme
        script: |
          set -euo pipefail
          test -f "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"
          test -f "$CM_BUILD_DIR/ios_mobile_kit/OpenClawVision/OpenClawVision.xcodeproj/xcshareddata/xcschemes/OpenClawVision.xcscheme"
          xcodebuild -project "$CM_BUILD_DIR/$XCODE_PROJECT" -list
      - name: Build iOS app and broadcast extension without signing
        script: |
          set +e
          xcodebuild \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build | tee "$CM_BUILD_DIR/build/xcodebuild.log"
          XCODE_STATUS=${PIPESTATUS[0]}
          if [ "$XCODE_STATUS" -ne 0 ]; then
            echo ""
            echo "========== XCODE ERROR SUMMARY =========="
            grep -nE '(^|[[:space:]])(error:|fatal error:)|The following build commands failed:|BUILD FAILED|ValidateEmbeddedBinary' \
              "$CM_BUILD_DIR/build/xcodebuild.log" | tail -n 120 || true
            echo "========== END XCODE ERROR SUMMARY ======"
            exit "$XCODE_STATUS"
          fi
      - name: Verify embedded broadcast extension
        script: |
          set -euo pipefail
          APP_PATH=$(find "$CM_BUILD_DIR/build/DerivedData/Build/Products/Debug-iphoneos" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          test -d "$APP_PATH/PlugIns/OpenClawBroadcast.appex"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APP_PATH/PlugIns/OpenClawBroadcast.appex/Info.plist"
    artifacts:
      - build/xcodebuild.log
      - build/DerivedData/Build/Products/Debug-iphoneos/*.app
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
  ios-native-adhoc:
    name: OpenClaw Vision - signed iPhone test
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.baijianyang.openclawvision
      vars:
        XCODE_PROJECT: ios_mobile_kit/OpenClawVision/OpenClawVision.xcodeproj
        XCODE_SCHEME: OpenClawVision
    scripts:
      - name: Apply profiles to app and broadcast extension
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

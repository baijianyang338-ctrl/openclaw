name: Delete obsolete gh-pages branch once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delete-gh-pages-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remove-branch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Remove gh-pages branch (only)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/git/refs/heads/gh-pages")
          if [ "$status" != "204" ]; then
            echo "Failed to delete gh-pages (HTTP $status)"
            cat /tmp/resp.json
            exit 1
          fi
          echo "Removed gh-pages branch"
